# Bootstrap config for izotov.dev — HTTP only, just enough to satisfy
# certbot's HTTP-01 challenge. After the cert is issued, this file is replaced
# by izotov.dev.conf which adds the HTTPS server block.

server {
    listen 80;
    server_name izotov.dev www.izotov.dev;

    root /home/admin-binom/izotov.dev/dist;
    index index.html;

    # SPA fallback so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
