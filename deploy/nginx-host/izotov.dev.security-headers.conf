# Security headers for izotov.dev.
#
# This lives in its own file because of how nginx's add_header works: directives
# are inherited from the enclosing block ONLY as long as the inner block adds no
# add_header of its own. Every location in izotov.dev.conf sets its own
# Cache-Control, which silently dropped all of the server-level security headers
# — the live site was serving none of them. Including this snippet inside each
# location restores them everywhere.
#
# Include it in every location block that sets any header.

add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "index, follow" always;

# The site loads no third-party scripts, fonts or frames — everything is bundled
# by Vite and served from this origin. 'unsafe-inline' is needed only for styles:
# React and framer-motion animate through inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
