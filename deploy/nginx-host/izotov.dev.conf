# Static host for izotov.dev, served behind the Cloudflare proxy.
#
# The site is prerendered: `npm run build` writes one HTML file per route
# (dist/index.html, dist/impressum/index.html, …), each with its own title,
# description, canonical URL and JSON-LD. nginx therefore serves real files and
# only falls back to a genuine 404 — there is no SPA catch-all rewriting every
# unknown path to the home page any more.
#
# TLS uses a Cloudflare Origin Certificate: valid only for connections coming
# from Cloudflare, which is all this host accepts — ufw opens 80/443 to
# Cloudflare's published ranges and to nobody else. Set the zone's SSL/TLS mode
# to Full (strict); the Origin CA is one Cloudflare trusts.
#
# The document root lives under /srv, not in a home directory: adduser creates
# homes as 0750, so nginx (www-data) cannot traverse into one and answers 403.
#
# Install: copy to /etc/nginx/sites-available/izotov.dev, symlink into
# sites-enabled/, copy izotov.dev.security-headers.conf into
# /etc/nginx/snippets/, then `sudo nginx -t && sudo systemctl reload nginx`.
# deploy/deploy-nginx.sh does all of that.

# Rate limit for the contact endpoint, enforced by nginx itself. The Node relay
# has its own in-memory limiter, but that one resets on every container restart;
# this one also protects against a flood that never reaches the app.
limit_req_zone $binary_remote_addr zone=izotov_contact:1m rate=6r/m;

server {
    server_name izotov.dev www.izotov.dev;

    root /srv/izotov.dev/dist;
    index index.html;

    # --- Real visitor IP -----------------------------------------------------
    # real_ip_header alone does nothing: without set_real_ip_from, nginx has no
    # trusted proxy to take the header from, so $remote_addr stays Cloudflare's
    # edge IP and every visitor shares one rate-limit bucket.
    # Cloudflare's published ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --- Compression ---------------------------------------------------------
    gzip                 on;
    gzip_vary            on;
    gzip_comp_level      6;
    gzip_min_length      1024;
    gzip_proxied         any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # --- Contact form API: reverse-proxy to the Dockerized relay. ------------
    # The izotov-contact-api container listens on 127.0.0.1:3002 and forwards
    # submissions to Telegram. Exact match so it wins over the static handler.
    location = /api/contact {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;

        limit_req zone=izotov_contact burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The relay rate-limits on X-Real-IP: nginx sets it from $remote_addr,
        # which real_ip has already resolved to the true visitor. X-Forwarded-For
        # is passed for logging only — a client can prepend anything to it.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # --- Hashed assets: long-cache, immutable. -------------------------------
    # Vite emits /assets/<name>-<hash>.<ext> — content-addressed, safe forever.
    location /assets/ {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Prerendered HTML: never cache, so deploys are visible immediately. ---
    location ~* \.html$ {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # --- Static favicons / manifests / images: short cache. ------------------
    location ~* \.(ico|png|svg|webmanifest|webp|woff2?)$ {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # --- Routes. Every real route exists on disk as <route>/index.html. ------
    # Anything else is genuinely missing and must say so: a catch-all returning
    # the home page with HTTP 200 for every typo is what search engines call a
    # soft 404 and index anyway.
    location / {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        internal;
    }

    # nginx 1.24 (Ubuntu 24.04) still takes http2 as a listen parameter; the
    # separate `http2 on;` directive only exists from 1.25.1.
    listen 443 ssl http2;

    ssl_certificate     /etc/ssl/izotov.dev/origin.pem;
    ssl_certificate_key /etc/ssl/izotov.dev/origin.key;

    # Only Cloudflare's edge terminates against this certificate, so there is no
    # legacy client to accommodate: TLS 1.2+ and forward-secret suites only.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:izotov_ssl:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # No OCSP stapling: the Origin CA publishes no OCSP responder that would
    # help here, and Cloudflare does not check it on this hop.
}

server {
    listen 80;
    server_name izotov.dev www.izotov.dev;

    # Cloudflare reaches the origin over HTTPS in Full (strict) mode; this is
    # only here so a plain-HTTP request from the edge is not left hanging.
    return 301 https://izotov.dev$request_uri;
}
