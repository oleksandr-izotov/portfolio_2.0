# Static host for izotov.dev, served behind the Cloudflare proxy.
#
# The site is prerendered: `npm run build` writes one HTML file per route
# (dist/index.html, dist/impressum/index.html, …), each with its own title,
# description, canonical URL and JSON-LD. nginx therefore serves real files and
# only falls back to a genuine 404 — there is no SPA catch-all rewriting every
# unknown path to the home page any more.
#
# Install: copy to /etc/nginx/sites-available/izotov.dev, symlink into
# sites-enabled/, copy izotov.dev.security-headers.conf next to it, then
# `sudo nginx -t && sudo systemctl reload nginx`.
# TLS certs are issued by certbot (see deploy/README.md for the first-run flow).

# Rate limit for the contact endpoint, enforced by nginx itself. The Node relay
# has its own in-memory limiter, but that one lives per container restart; this
# one also protects against a flood that never reaches the app.
limit_req_zone $binary_remote_addr zone=izotov_contact:1m rate=6r/m;

server {
    server_name izotov.dev www.izotov.dev;

    root /home/admin-binom/izotov.dev/dist;
    index index.html;

    # --- Real visitor IP -----------------------------------------------------
    # real_ip_header alone does nothing: without set_real_ip_from, nginx has no
    # trusted proxy to take the header from, so $remote_addr stayed Cloudflare's
    # edge IP and every visitor shared one rate-limit bucket.
    # Cloudflare's published ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --- Compression -----------------------------------------------------
    gzip                 on;
    gzip_vary            on;
    gzip_comp_level      6;
    gzip_min_length      1024;
    gzip_proxied         any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # --- Contact form API: reverse-proxy to the Dockerized relay. ------------
    # The izotov-contact-api container listens on 127.0.0.1:3002 and forwards
    # submissions to Telegram. Exact match so it wins over the static handler.
    location = /api/contact {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;

        limit_req zone=izotov_contact burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The relay rate-limits on X-Real-IP: nginx sets it from $remote_addr,
        # which real_ip has already resolved to the true visitor. X-Forwarded-For
        # is passed for logging only — a client can prepend anything to it.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # --- Hashed assets: long-cache, immutable. -------------------------------
    # Vite emits /assets/<name>-<hash>.<ext> — content-addressed, safe forever.
    location /assets/ {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Prerendered HTML: never cache, so deploys are visible immediately. ---
    location ~* \.html$ {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # --- Static favicons / manifests / images: short cache. ------------------
    location ~* \.(ico|png|svg|webmanifest|webp|woff2?)$ {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # --- Routes. Every real route exists on disk as <route>/index.html. ------
    # Anything else is genuinely missing and must say so: the old catch-all
    # returned the home page with HTTP 200 for every typo, which is what search
    # engines call a soft 404 and index anyway.
    location / {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/izotov.dev.security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        internal;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/izotov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izotov.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.izotov.dev) { return 301 https://izotov.dev$request_uri; }
    if ($host = izotov.dev)     { return 301 https://izotov.dev$request_uri; }

    listen 80;
    server_name izotov.dev www.izotov.dev;
    return 404;
}
