# Static SPA host for izotov.dev served behind Cloudflare proxy.
# Cloudflare caches /assets/* aggressively (immutable hashed names);
# index.html stays no-cache so deploys propagate without purge.
#
# Install: copy to /etc/nginx/sites-available/izotov.dev, symlink into sites-enabled/,
# then `sudo nginx -t && sudo systemctl reload nginx`.
# TLS certs are issued by certbot (see deploy/README.md for first-run flow).

server {
    server_name izotov.dev www.izotov.dev;

    root /home/admin-binom/izotov.dev/dist;
    index index.html;

    # --- Compression -----------------------------------------------------
    gzip                 on;
    gzip_vary            on;
    gzip_comp_level      6;
    gzip_min_length      1024;
    gzip_proxied         any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # --- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Real visitor IP behind Cloudflare proxy. nginx already has set_real_ip_from
    # globally for cp-binom; if not, add CF ranges here. CF sends CF-Connecting-IP.
    real_ip_header CF-Connecting-IP;

    # --- Contact form API: reverse-proxy to the Dockerized relay. ------------
    # The izotov-contact-api container listens on 127.0.0.1:3002 and forwards
    # submissions to Telegram. Exact match so it wins over the SPA fallback.
    location = /api/contact {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # --- Hashed assets: long-cache, immutable. -------------------------------
    # Vite emits /assets/<name>-<hash>.<ext> — content-addressed, safe forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- index.html: never cache, so deploys are visible on next visit. ------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # --- Static favicons / manifests / robots / sitemap: short cache. --------
    location ~* \.(ico|png|svg|webmanifest|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /robots.txt   { expires 1d; add_header Cache-Control "public, max-age=86400"; }
    location = /sitemap.xml  { expires 1d; add_header Cache-Control "public, max-age=86400"; }

    # --- SPA fallback. Must be last. -----------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/izotov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izotov.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.izotov.dev) { return 301 https://izotov.dev$request_uri; }
    if ($host = izotov.dev)     { return 301 https://izotov.dev$request_uri; }

    listen 80;
    server_name izotov.dev www.izotov.dev;
    return 404;
}
